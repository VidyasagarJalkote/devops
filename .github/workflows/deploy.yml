name: Deploy to AWS S3

# Run this pipeline every time code is pushed to the main branch
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync site files to S3
        run: |
          aws s3 sync ./site s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Deployment summary
        run: echo "✅ Deployed to bucket ${{ secrets.S3_BUCKET_NAME }} in ${{ secrets.AWS_REGION }}"
